name: stormy_kit_workspace
publish_to: none
workspace:
  - packages/stormy_core
  - packages/stormy_platform
  - packages/stormy_ui
  - packages/stormy_i18n_generator
  - packages/stormy_kit
  - packages/stormy_china_pay
  - packages/stormy_store_pay
  - packages/stormy_i18n
  - packages/stormy_gromore
environment:
  sdk: ">=3.13.0 <4.0.0"
dev_dependencies:
  melos: ^7.5.0
dependency_overrides:
  # Flutter 3.47.1 pins test_api 0.7.12 while Riverpod's transitive test
  # constraint and stormy_i18n's analyzer 14 AST currently do not converge.
  # Remove this workspace override when that dependency graph converges.
  analyzer: 14.0.0
melos:
  name: stormy_kit_workspace
  packages:
    - packages/**
  scripts:
    upgrade_major_versions:
      run: |
        melos exec -- flutter pub upgrade --major-versions
